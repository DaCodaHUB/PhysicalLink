[platformio]
; Promote future examples only after they work and pass validation.
default_envs = real-sensors
src_dir = .

[env]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = h2zero/NimBLE-Arduino@2.5.1

[env:real-sensors]
build_src_filter = -<*> +<examples/real_sensors/main.cpp>

[env:basic]
build_src_filter = -<*> +<examples/basic/main.cpp>

[env:stress-test]
build_src_filter = -<*> +<examples/stress_test/main.cpp>

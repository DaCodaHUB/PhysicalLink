; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Promote future examples only after they work and pass validation.
default_envs = v2-real-sensors
src_dir = .

[env:esp32dev]
; Explicit legacy v1 regression target.
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<src/main.cpp>

lib_deps =
    adafruit/Adafruit BME280 Library
    h2zero/NimBLE-Arduino

[env:v2-real-sensors]
extends = env:esp32dev
platform = espressif32@7.1.3
build_src_filter = -<*> +<examples/v2_real_sensors/main.cpp>
build_flags =
    -DPHYSICAL_LINK_EXPERIMENTAL_V2_METADATA=1
    -DPHYSICAL_LINK_METADATA_TEST_MTU=23
lib_deps = h2zero/NimBLE-Arduino@2.5.1

[env:v2-metadata-experimental]
; Retained sixteen-channel synthetic metadata/live stress test.
extends = env:v2-real-sensors
build_src_filter = -<*> +<examples/v2_metadata/main.cpp>

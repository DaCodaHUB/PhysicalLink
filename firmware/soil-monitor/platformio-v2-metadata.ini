; Explicit, metadata-only experiment. The default platformio.ini is unchanged.
[platformio]
extra_configs = platformio.ini
src_dir = examples/v2_metadata
build_dir = .pio/build-v2-metadata
libdeps_dir = .pio/libdeps-v2-metadata

[env:v2-metadata-experimental]
extends = env:esp32dev
platform = espressif32@7.1.3
build_flags =
    -DPHYSICAL_LINK_EXPERIMENTAL_V2_METADATA=1
    -DPHYSICAL_LINK_METADATA_TEST_MTU=23
lib_deps = h2zero/NimBLE-Arduino@2.5.1
